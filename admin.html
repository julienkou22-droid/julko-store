<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin JULKO STORE</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f2ea;color:#111}header{background:#080808;color:#fff;padding:22px}header b{color:#d5b348;font-size:25px}.wrap{max-width:1000px;margin:auto;padding:20px}.box{background:#fff;padding:20px;border-radius:20px;margin:15px 0}.hide{display:none}input,select{width:100%;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:11px}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:800;background:#111;color:#fff}.gold{background:#d5b348;color:#111}.badge{background:#d22;color:#fff;border-radius:20px;padding:5px 10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#111;color:#fff;padding:15px;border-radius:15px}.stat strong{display:block;color:#d5b348;font-size:26px}.order{border:1px solid #ddd;border-radius:15px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}@media(max-width:600px){.stats{grid-template-columns:1fr}}</style></head><body><header><b>JULKO STORE</b><div>Administration</div></header><main class="wrap"><section id="login" class="box"><h2>Connexion administrateur</h2><input id="phone" placeholder="Téléphone"><input id="password" type="password" placeholder="Mot de passe"><button class="btn gold" onclick="loginAdmin()">Connexion</button><p id="msg"></p></section><section id="dashboard" class="hide"><div class="box row"><div><h2>Tableau de bord <span id="badge" class="badge">0 nouvelle</span></h2><p id="welcome"></p></div><button class="btn" onclick="logoutAdmin()">Déconnexion</button></div><div class="stats"><div class="stat">Commandes<strong id="orders">0</strong></div><div class="stat">Nouvelles<strong id="newOrders">0</strong></div><div class="stat">Clients<strong id="customers">0</strong></div></div><div class="box"><h2>Commandes</h2><div id="list"></div></div></section></main><script>const H=()=>({'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('julko_admin_token')});async function loginAdmin(){const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value,password:password.value})});const d=await r.json().catch(()=>({error:'Erreur'}));if(!r.ok||d.user.role!=='admin'){msg.textContent=d.error||'Compte non administrateur';return}localStorage.setItem('julko_admin_token',d.token);localStorage.setItem('julko_admin_user',JSON.stringify(d.user));load()}async function load(){const token=localStorage.getItem('julko_admin_token');if(!token)return;const [a,b]=await Promise.all([fetch('/api/admin/overview',{headers:H()}),fetch('/api/admin/orders',{headers:H()})]);if(!a.ok||!b.ok){logoutAdmin();return}const ov=await a.json(),os=await b.json(),u=JSON.parse(localStorage.getItem('julko_admin_user'));login.classList.add('hide');dashboard.classList.remove('hide');welcome.textContent='Connecté : '+u.name;orders.textContent=ov.orders;newOrders.textContent=ov.newOrders;customers.textContent=ov.customers;badge.textContent=ov.newOrders+' nouvelle(s)';list.innerHTML=os.length?os.map(o=>`<article class="order"><div class="row"><b>Commande #${o.id}</b><b>${Number(o.total_xof).toLocaleString('fr-FR')} FCFA</b></div><p>${o.customer_name} • ${o.phone}<br>${o.city}, ${o.address}</p><p>${o.items.map(i=>`${i.quantity}× ${i.brand||''} ${i.product_name}`).join('<br>')}</p><select id="s${o.id}"><option value="new">Nouvelle</option><option value="confirmed">Confirmée</option><option value="preparing">Préparation</option><option value="out_for_delivery">En livraison</option><option value="delivered">Livrée</option><option value="cancelled">Annulée</option></select><button class="btn" onclick="setStatus(${o.id})">Mettre à jour</button> <button class="btn gold" onclick="paid(${o.id})">Wave reçu + Livrée</button><p>Paiement : ${o.payment_status==='paid'?'Reçu':'En attente'}</p></article>`).join(''):'Aucune commande';os.forEach(o=>document.getElementById('s'+o.id).value=o.status)}async function setStatus(id){await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:H(),body:JSON.stringify({status:document.getElementById('s'+id).value})});load()}async function paid(id){await fetch('/api/admin/orders/'+id+'/payment',{method:'POST',headers:H(),body:'{}'});load()}function logoutAdmin(){localStorage.removeItem('julko_admin_token');localStorage.removeItem('julko_admin_user');dashboard.classList.add('hide');login.classList.remove('hide')}load();</script></body></html>
