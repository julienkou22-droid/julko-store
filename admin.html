<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin JULKO STORE</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f0e8}header{background:#080808;color:#fff;padding:20px}header b{color:#d5b348;font-size:25px}.wrap{max-width:1100px;margin:auto;padding:18px}.box{background:#fff;padding:18px;border-radius:18px;margin:12px 0}.hide{display:none}.tabs{display:flex;gap:8px;overflow:auto}.btn{border:0;border-radius:10px;padding:11px;font-weight:bold;background:#111;color:#fff}.gold{background:#d5b348;color:#111}input,select{width:100%;padding:11px;margin:5px 0;border:1px solid #ddd;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#111;color:#fff;padding:14px;border-radius:14px}.stat strong{color:#d5b348;font-size:24px;display:block}.item{border:1px solid #ddd;border-radius:14px;padding:12px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}.badge{background:#c22;color:#fff;padding:4px 8px;border-radius:20px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}</style><header><b>JULKO STORE</b><div>Panneau administrateur complet</div></header><main class="wrap"><section id="login" class="box"><h2>Connexion admin</h2><input id="phone" placeholder="Téléphone"><input id="password" type="password" placeholder="Mot de passe"><button class="btn gold" onclick="loginAdmin()">Connexion</button><p id="msg"></p></section><section id="app" class="hide"><div class="box row"><div><b id="welcome"></b></div><button class="btn" onclick="logout()">Déconnexion</button></div><div class="grid"><div class="stat">Produits<strong id="sp">0</strong></div><div class="stat">Commandes<strong id="so">0</strong></div><div class="stat">Nouvelles<strong id="sn">0</strong></div><div class="stat">Clients<strong id="sc">0</strong></div></div><div class="box tabs"><button class="btn gold" onclick="tab('products')">Produits</button><button class="btn" onclick="tab('orders')">Commandes <span id="badge" class="badge">0</span></button></div><section id="products" class="box"><h2>Produits</h2><button class="btn gold" onclick="editProduct()">+ Ajouter un produit</button><form id="pf" class="hide" onsubmit="saveProduct(event)"><input id="pid" type="hidden"><input id="pn" placeholder="Nom" required><input id="pb" placeholder="Marque"><input id="pc" placeholder="Catégorie" required><input id="pp" type="number" placeholder="Prix FCFA" required><input id="ps" type="number" placeholder="Stock" required><input id="pi" placeholder="URL photo"><button class="btn gold">Enregistrer</button></form><div id="plist"></div></section><section id="orders" class="box hide"><h2>Commandes</h2><div id="olist"></div></section></section></main><script>const H=()=>({'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('julko_admin_token')});async function loginAdmin(){const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value,password:password.value})}),d=await r.json();if(!r.ok||d.user.role!=='admin'){msg.textContent=d.error||'Accès refusé';return}localStorage.setItem('julko_admin_token',d.token);localStorage.setItem('julko_admin_user',JSON.stringify(d.user));load()}function tab(x){products.classList.toggle('hide',x!=='products');orders.classList.toggle('hide',x!=='orders')}async function load(){if(!localStorage.getItem('julko_admin_token'))return;const [a,p,o]=await Promise.all([fetch('/api/admin/overview',{headers:H()}),fetch('/api/admin/products',{headers:H()}),fetch('/api/admin/orders',{headers:H()})]);if(!a.ok){logout();return}const x=await a.json(),ps=await p.json(),os=await o.json(),u=JSON.parse(localStorage.getItem('julko_admin_user'));login.classList.add('hide');app.classList.remove('hide');welcome.textContent='Connecté : '+u.name;sp.textContent=x.products;so.textContent=x.orders;sn.textContent=x.newOrders;sc.textContent=x.customers;badge.textContent=x.newOrders;plist.innerHTML=ps.map(z=>`<div class="item row"><div><b>${z.brand||''} ${z.name}</b><br>${z.price_xof.toLocaleString('fr-FR')} FCFA • Stock ${z.stock} • ${z.active?'Visible':'Masqué'}</div><div><button class="btn" onclick='editProduct(${JSON.stringify(z)})'>Modifier</button> <button class="btn" onclick="removeProduct(${z.id})">Masquer</button></div></div>`).join('');olist.innerHTML=os.map(z=>`<div class="item"><div class="row"><b>Commande #${z.id}</b><b>${z.total_xof.toLocaleString('fr-FR')} FCFA</b></div><p>${z.customer_name} • ${z.phone}<br>${z.city}, ${z.address}</p><p>${z.items.map(i=>`${i.quantity}× ${i.brand||''} ${i.product_name}`).join('<br>')}</p><label>Commande</label><select id="o${z.id}"><option value="new">Nouvelle</option><option value="confirmed">Validée</option><option value="preparing">Préparation</option><option value="cancelled">Annulée</option></select><label>Livraison</label><select id="d${z.id}"><option value="to_prepare">À préparer</option><option value="ready">Prête</option><option value="out_for_delivery">En livraison</option><option value="delivered">Livrée</option><option value="failed">Échec</option></select><button class="btn" onclick="updateOrder(${z.id})">Mettre à jour</button> <button class="btn gold" onclick="paid(${z.id})">Wave reçu</button><p>Paiement : ${z.payment_status==='paid'?'Reçu':'En attente'}</p></div>`).join('')||'Aucune commande';os.forEach(z=>{document.getElementById('o'+z.id).value=z.order_status;document.getElementById('d'+z.id).value=z.delivery_status})}function editProduct(z={}){pf.classList.remove('hide');pid.value=z.id||'';pn.value=z.name||'';pb.value=z.brand||'';pc.value=z.category||'';pp.value=z.price_xof||'';ps.value=z.stock||0;pi.value=z.image_url||''}async function saveProduct(e){e.preventDefault();const id=pid.value,b={name:pn.value,brand:pb.value,category:pc.value,price_xof:Number(pp.value),stock:Number(ps.value),image_url:pi.value,active:1};await fetch(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',headers:H(),body:JSON.stringify(b)});pf.reset();pf.classList.add('hide');load()}async function removeProduct(id){if(confirm('Masquer ce produit ?')){await fetch('/api/admin/products/'+id,{method:'DELETE',headers:H()});load()}}async function updateOrder(id){await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:H(),body:JSON.stringify({order_status:document.getElementById('o'+id).value,delivery_status:document.getElementById('d'+id).value})});load()}async function paid(id){await fetch('/api/admin/orders/'+id+'/payment',{method:'POST',headers:H(),body:'{}'});load()}function logout(){localStorage.removeItem('julko_admin_token');localStorage.removeItem('julko_admin_user');location.reload()}load();</script></html>
