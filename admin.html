<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration JULKO STORE</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f1e9;color:#111}header{background:#090909;color:white;padding:22px}header b{color:#d4af37;font-size:25px}.wrap{max-width:900px;margin:auto;padding:20px}.box{background:white;border-radius:20px;padding:22px;margin:18px 0;box-shadow:0 5px 20px #0001}input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:11px}button{border:0;border-radius:12px;padding:12px 15px;font-weight:800;background:#111;color:white}.gold{background:#d4af37;color:#111}.hide{display:none}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#111;color:white;border-radius:16px;padding:16px}.card strong{display:block;color:#d4af37;font-size:25px;margin-top:8px}.msg{font-weight:bold;margin-top:12px}@media(max-width:600px){.cards{grid-template-columns:1fr}}</style></head><body><header><b>JULKO STORE</b><div>Espace administrateur</div></header><main class="wrap"><section id="loginBox" class="box"><h2>Connexion administrateur</h2><input id="phone" placeholder="Numéro de téléphone" inputmode="tel"><input id="password" type="password" placeholder="Mot de passe"><button class="gold" onclick="loginAdmin()">Se connecter</button><div id="loginMsg" class="msg"></div></section><section id="dashboard" class="hide"><div class="box"><div style="display:flex;justify-content:space-between;gap:10px"><div><h2>Tableau de bord</h2><p id="welcome"></p></div><button onclick="logoutAdmin()">Déconnexion</button></div><div class="cards"><div class="card">Produits<strong id="productsCount">0</strong></div><div class="card">Commandes<strong id="ordersCount">0</strong></div><div class="card">Clients<strong id="clientsCount">0</strong></div></div></div><div class="box"><h2>Gestion JULKO STORE</h2><p>Le compte administrateur est connecté et autorisé.</p><p>Les fonctions Produits, Commandes et Clients seront alimentées par les routes protégées du serveur.</p></div></section></main><script>async function loginAdmin(){const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value,password:password.value})});const d=await r.json().catch(()=>({error:'Erreur serveur'}));if(!r.ok){loginMsg.textContent=d.error||'Connexion impossible';return}if(d.user.role!=='admin'){loginMsg.textContent='Ce compte est un compte client, pas administrateur.';return}localStorage.setItem('julko_admin_token',d.token);localStorage.setItem('julko_admin_user',JSON.stringify(d.user));showDashboard()}async function showDashboard(){const token=localStorage.getItem('julko_admin_token');const user=JSON.parse(localStorage.getItem('julko_admin_user')||'null');if(!token||!user)return;const r=await fetch('/api/admin/overview',{headers:{Authorization:'Bearer '+token}});if(!r.ok){logoutAdmin();return}const d=await r.json();loginBox.classList.add('hide');dashboard.classList.remove('hide');welcome.textContent='Connecté : '+user.name;productsCount.textContent=d.products;ordersCount.textContent=d.orders;clientsCount.textContent=d.customers}function logoutAdmin(){localStorage.removeItem('julko_admin_token');localStorage.removeItem('julko_admin_user');dashboard.classList.add('hide');loginBox.classList.remove('hide')}showDashboard();</script></body></html>
