<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JULKO STORE</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f5ef;color:#111}header{background:#080808;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.top,.wrap{max-width:1100px;margin:auto}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.logo{font-size:25px;font-weight:900;color:#d5b348}.search,input,select{padding:13px;border:1px solid #ddd;border-radius:12px}.search{flex:1;min-width:220px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;background:#171717;color:#fff}.gold{background:#d5b348;color:#111}.wrap{padding:20px}.panel{display:none;background:#fff;padding:20px;border-radius:20px;margin:16px 0}.panel.on{display:block}.panel input,.panel select{width:100%;margin:6px 0}.hero{background:linear-gradient(120deg,#080808,#332812);color:#fff;padding:30px;border-radius:25px}.hero b,.price{color:#d5b348}.cats{display:flex;gap:8px;overflow:auto;margin:20px 0}.cats button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:18px;overflow:hidden}.photo{aspect-ratio:1;padding:10px}.photo img{width:100%;height:100%;object-fit:contain}.info{padding:13px}.cart{background:#fff;padding:20px;border-radius:20px;margin-top:22px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.msg{font-weight:bold;margin-top:10px}.hide{display:none}@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><div class="top"><div class="logo">JULKO STORE</div><input id="q" class="search" placeholder="Rechercher"><button id="loginBtn" class="btn" onclick="show('login')">Connexion</button><button id="registerBtn" class="btn gold" onclick="show('register')">Créer un compte</button><button class="btn" onclick="goCart()">Panier <span id="count">0</span></button></div></header><main class="wrap"><div><span id="sessionText">Non connecté</span> <button id="logoutBtn" class="btn hide" onclick="logoutUser()">Déconnexion</button></div><section id="register" class="panel"><h2>Créer mon compte</h2><input id="rName" placeholder="Nom complet"><input id="rPhone" placeholder="Téléphone"><input id="rPass" type="password" placeholder="Mot de passe, 12 caractères minimum"><button class="btn gold" onclick="registerUser()">Créer</button><div id="rMsg" class="msg"></div></section><section id="login" class="panel"><h2>Se connecter</h2><input id="lPhone" placeholder="Téléphone"><input id="lPass" type="password" placeholder="Mot de passe"><button class="btn gold" onclick="loginUser()">Connexion</button><div id="lMsg" class="msg"></div></section><section id="delivery" class="panel"><h2>Adresse de livraison</h2><select id="city"><option value="">Choisir la ville/commune</option><option>Grand-Bassam</option><option>Abidjan</option><option>Bingerville</option><option>Autre ville</option></select><input id="address" placeholder="Quartier, adresse et repère"><p>Le tarif de livraison sera confirmé par le service client.</p><button class="btn gold" onclick="submitOrder()">Confirmer la commande</button><div id="deliveryMsg" class="msg"></div></section><section class="hero"><b>GRAND-BASSAM</b><h1>De vrais modèles, de vraies marques</h1><p>Paiement Wave à la livraison.</p></section><div id="cats" class="cats"></div><h2>Nos produits</h2><section id="products" class="grid"></section><section id="cart" class="cart"><h2>Mon panier</h2><div id="items"></div><div class="row"><b>Total</b><b id="total" class="price">0 FCFA</b></div><button class="btn gold" style="width:100%;margin-top:12px" onclick="startOrder()">Commander</button><div id="orderMsg" class="msg"></div></section></main><script>
const ps=[{b:'Samsung',n:'Galaxy A07 4/64 Go',c:'Téléphones',p:89000,img:'https://th.bing.com/th?id=OPEC.h%2fuiKaBLUEZnTQ474C474&o=5&pid=21.1&w=474&h=474'},{b:'Samsung',n:'Galaxy A06 4/64 Go',c:'Téléphones',p:71900,img:'https://th.bing.com/th?id=OPEC.81gaTPv%2fhGnIQg474C474&o=5&pid=21.1&w=410&h=410'},{b:'Oraimo',n:'Air12 Pro',c:'Audio',p:7110,img:'https://th.bing.com/th?id=OPEC.yoeOwqQWo81X5A474C474&o=5&pid=21.1&w=304&h=304'},{b:'Oraimo',n:'SpaceBuds Lite OTW-324',c:'Audio',p:10500,img:'https://th.bing.com/th?id=OPEC.NpjLuWEaPsmCiw474C474&o=5&pid=21.1&w=408&h=408'},{b:'Oraimo',n:'Watch 6 Lite',c:'Montres',p:11400,img:'https://th.bing.com/th?id=OPEC.6FC1Y2s9UlR9hw474C474&o=5&pid=21.1&w=376&h=376'},{b:'Oraimo',n:'Space-Box OBS-382',c:'Audio',p:12000,img:'https://th.bing.com/th?id=OPEC.%2fQIiubmiCxN7aA474C474&o=5&pid=21.1&w=474&h=474'},{b:'Oraimo',n:'Chargeur USB Type-C 10W',c:'Accessoires',p:5000,img:'https://th.bing.com/th?id=OPEC.iIG08wOfto0hZw474C474&o=5&pid=21.1&w=489&h=489'},{b:'Generic',n:'Coque Galaxy A07',c:'Accessoires',p:3500,img:'https://th.bing.com/th?id=OPEC.KPynv04qba6wcw474C474&o=5&pid=21.1&w=430&h=430'}].map((x,i)=>({...x,id:i}));let cart=[],cat='Tous';const money=n=>n.toLocaleString('fr-FR')+' FCFA';function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.getElementById(id).scrollIntoView({behavior:'smooth'})}function renderCats(){cats.innerHTML=['Tous',...new Set(ps.map(x=>x.c))].map(x=>`<button class="btn" onclick="cat='${x}';render()">${x}</button>`).join('')}function render(){const s=q.value.toLowerCase();products.innerHTML=ps.filter(x=>(cat==='Tous'||x.c===cat)&&(x.b+' '+x.n).toLowerCase().includes(s)).sort((a,b)=>a.p-b.p).map(x=>`<article class="card"><div class="photo"><img src="${x.img}" alt="${x.b} ${x.n}"></div><div class="info"><small>${x.b}</small><h3>${x.n}</h3><div class="price">${money(x.p)}</div><button class="btn" onclick="add(${x.id})">Ajouter</button></div></article>`).join('')}function add(id){const z=cart.find(x=>x.id===id);z?z.qty++:cart.push({id,qty:1});draw()}function draw(){count.textContent=cart.reduce((s,x)=>s+x.qty,0);items.innerHTML=cart.length?cart.map(x=>`<div class="row"><span>${ps[x.id].n} × ${x.qty}</span><b>${money(ps[x.id].p*x.qty)}</b></div>`).join(''):'Panier vide';total.textContent=money(cart.reduce((s,x)=>s+ps[x.id].p*x.qty,0))}function goCart(){document.getElementById('cart').scrollIntoView({behavior:'smooth'})}async function api(url,body,method='POST',auth=false){const token=localStorage.getItem('julko_token');const r=await fetch(url,{method,headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});return{ok:r.ok,data:await r.json().catch(()=>({error:'Erreur serveur'}))}}async function registerUser(){const z=await api('/api/auth/register',{name:rName.value,phone:rPhone.value,password:rPass.value});if(z.ok){lPhone.value=rPhone.value;rMsg.textContent='Compte créé.';setTimeout(()=>show('login'),500)}else rMsg.textContent=z.data.error}async function loginUser(){const z=await api('/api/auth/login',{phone:lPhone.value,password:lPass.value});if(z.ok){localStorage.setItem('julko_token',z.data.token);localStorage.setItem('julko_user',JSON.stringify(z.data.user));updateSession()}else lMsg.textContent=z.data.error}function updateSession(){const u=JSON.parse(localStorage.getItem('julko_user')||'null');sessionText.textContent=u?'Connecté : '+u.name:'Non connecté';logoutBtn.classList.toggle('hide',!u);loginBtn.classList.toggle('hide',!!u);registerBtn.classList.toggle('hide',!!u);if(u)document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'))}function logoutUser(){localStorage.clear();updateSession()}function startOrder(){if(!cart.length){orderMsg.textContent='Panier vide.';return}if(!localStorage.getItem('julko_token')){orderMsg.textContent='Connecte-toi avant de commander.';show('login');return}show('delivery')}async function submitOrder(){const payload={city:city.value,address:address.value,items:cart.map(x=>({product_name:ps[x.id].n,brand:ps[x.id].b,quantity:x.qty,unit_price_xof:ps[x.id].p}))};const z=await api('/api/orders',payload,'POST',true);if(z.ok){deliveryMsg.textContent='Commande #'+z.data.orderId+' enregistrée. Total : '+money(z.data.total_xof);cart=[];draw()}else deliveryMsg.textContent=z.data.error||'Commande impossible'}q.addEventListener('input',render);renderCats();render();draw();updateSession();
</script></body></html>
