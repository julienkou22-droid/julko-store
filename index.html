<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JULKO STORE</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f6f3ec}header{background:#080808;color:#fff;padding:18px}.top,.wrap{max-width:1100px;margin:auto}.top{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.logo{color:#d5b348;font-size:24px;font-weight:900}.btn{border:0;border-radius:10px;padding:11px;font-weight:bold;background:#111;color:#fff}.gold{background:#d5b348;color:#111}input,select{padding:12px;border:1px solid #ddd;border-radius:10px}.search{flex:1}.wrap{padding:18px}.panel,.cart{background:#fff;padding:18px;border-radius:18px;margin:14px 0}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:16px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:contain;padding:8px}.info{padding:12px}.price{color:#b88b20;font-weight:900}.wa{position:fixed;right:18px;bottom:22px;background:#25D366;color:#fff;text-decoration:none;padding:14px 16px;border-radius:30px;font-weight:bold;box-shadow:0 5px 15px #0004}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}</style><header><div class="top"><div class="logo">JULKO STORE</div><input id="search" class="search" placeholder="Rechercher"><button id="lb" class="btn" onclick="show('login')">Connexion</button><button id="rb" class="btn gold" onclick="show('register')">Créer un compte</button><button id="myOrdersBtn" class="btn hide" onclick="loadMyOrders()">Mes commandes</button><button class="btn" onclick="cartBox.scrollIntoView()">Panier <span id="count">0</span></button></div></header><main class="wrap"><p id="session">Non connecté</p><section id="register" class="panel hide"><h2>Créer un compte</h2><input id="rn" placeholder="Nom"><input id="rp" placeholder="Téléphone"><input id="rw" type="password" placeholder="Mot de passe 12 caractères"><button class="btn gold" onclick="register()">Créer</button><p id="rm"></p></section><section id="login" class="panel hide"><h2>Connexion</h2><input id="lp" placeholder="Téléphone"><input id="lw" type="password" placeholder="Mot de passe"><button class="btn gold" onclick="loginUser()">Connexion</button><p id="lm"></p></section><section id="myOrders" class="panel hide"><h2>Mes commandes</h2><div id="myOrdersList"></div></section><h1>Nos produits</h1><section id="products" class="grid"></section><section id="cartBox" class="cart"><h2>Panier</h2><div id="items"></div><b id="total">0 FCFA</b><button class="btn gold" style="width:100%;margin-top:12px" onclick="checkout()">Commander</button><button class="btn" style="width:100%;margin-top:8px;background:#25D366" onclick="whatsappCart()">Envoyer le panier sur WhatsApp</button></section><section id="delivery" class="panel hide"><h2>Livraison</h2><select id="city"><option value="">Ville/commune</option><option>Grand-Bassam</option><option>Abidjan</option><option>Bingerville</option><option>Autre</option></select><input id="address" placeholder="Quartier, adresse et repère"><p>Wave à la livraison. Tarif confirmé par le service client.</p><button class="btn gold" onclick="order()">Confirmer</button><p id="om"></p></section></main><a class="wa" href="https://wa.me/2250757290996?text=Bonjour%20JULKO%20STORE%2C%20j%27ai%20besoin%20d%27aide" target="_blank">WhatsApp service client</a><script>let ps=[],cart=[];const money=n=>n.toLocaleString('fr-FR')+' FCFA';function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide')}async function loadProducts(){ps=await fetch('/api/products').then(r=>r.json());render()}function render(){const s=search.value.toLowerCase();products.innerHTML=ps.filter(x=>(x.brand+' '+x.name).toLowerCase().includes(s)).map(x=>`<article class="card"><img src="${x.image_url||''}" alt="${x.name}"><div class="info"><small>${x.brand||''}</small><h3>${x.name}</h3><div class="price">${money(x.price_xof)}</div><p>Stock : ${x.stock}</p><button class="btn" ${x.stock<1?'disabled':''} onclick="add(${x.id})">Ajouter</button></div></article>`).join('')||'<p>Aucun produit. Ajoute les produits depuis /admin.</p>'}function add(id){const z=cart.find(x=>x.id===id);z?z.qty++:cart.push({id,qty:1});draw()}function draw(){count.textContent=cart.reduce((a,x)=>a+x.qty,0);items.innerHTML=cart.map(x=>{const p=ps.find(y=>y.id===x.id);return `<div class="row"><span>${p.name} × ${x.qty}</span><b>${money(p.price_xof*x.qty)}</b></div>`}).join('')||'Panier vide';total.textContent=money(cart.reduce((a,x)=>{const p=ps.find(y=>y.id===x.id);return a+p.price_xof*x.qty},0))}async function api(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return{ok:r.ok,d:await r.json().catch(()=>({error:'Erreur'}))}}async function register(){const z=await api('/api/auth/register',{name:rn.value,phone:rp.value,password:rw.value});rm.textContent=z.ok?'Compte créé, connecte-toi.':z.d.error}async function loginUser(){const z=await api('/api/auth/login',{phone:lp.value,password:lw.value});if(z.ok){localStorage.setItem('julko_token',z.d.token);localStorage.setItem('julko_user',JSON.stringify(z.d.user));update()}else lm.textContent=z.d.error}function update(){const u=JSON.parse(localStorage.getItem('julko_user')||'null');session.textContent=u?'Connecté : '+u.name:'Non connecté';lb.classList.toggle('hide',!!u);rb.classList.toggle('hide',!!u);myOrdersBtn.classList.toggle('hide',!u);if(u)document.querySelectorAll('.panel').forEach(x=>x.classList.add('hide'))}async function loadMyOrders(){const r=await fetch('/api/my-orders',{headers:{Authorization:'Bearer '+localStorage.getItem('julko_token')}});if(!r.ok)return;const os=await r.json();myOrdersList.innerHTML=os.length?os.map(o=>`<div class="row"><span>Commande #${o.id}<br>Commande: ${o.order_status}<br>Livraison: ${o.delivery_status}<br>Paiement: ${o.payment_status}</span><b>${money(o.total_xof)}</b></div>`).join(''):'Aucune commande';show('myOrders')}function whatsappCart(){if(!cart.length)return;const lines=cart.map(x=>{const p=ps.find(y=>y.id===x.id);return `${x.qty} x ${p.brand||''} ${p.name} - ${money(p.price_xof*x.qty)}`});const totalValue=cart.reduce((a,x)=>{const p=ps.find(y=>y.id===x.id);return a+p.price_xof*x.qty},0);const text=['Bonjour JULKO STORE, voici mon panier :',...lines,'Total produits : '+money(totalValue),'Je souhaite connaître le tarif de livraison.'].join('\n');window.open('https://wa.me/2250757290996?text='+encodeURIComponent(text),'_blank')}function checkout(){if(!cart.length)return;if(!localStorage.getItem('julko_token'))return show('login');show('delivery')}async function order(){const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('julko_token')},body:JSON.stringify({city:city.value,address:address.value,items:cart.map(x=>({product_id:x.id,quantity:x.qty}))})}),d=await r.json();if(r.ok){om.textContent='Commande #'+d.orderId+' enregistrée.';cart=[];draw();loadProducts()}else om.textContent=d.error}search.addEventListener('input',render);loadProducts();draw();update();</script></html>
