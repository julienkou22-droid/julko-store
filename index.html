<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JULKO STORE</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f5ef;color:#111}header{background:#080808;color:white;padding:18px}.top{max-width:1100px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.logo{font-size:25px;font-weight:900;color:#d6b343}.search{flex:1;min-width:220px;padding:13px;border-radius:13px;border:0}.b{border:0;border-radius:12px;padding:12px 14px;font-weight:800;background:#191919;color:white}.gold{background:#d4af37;color:#111}.wrap{max-width:1100px;margin:auto;padding:20px}.authbar{display:flex;gap:10px;margin:12px 0}.panel{display:none;background:white;border-radius:20px;padding:20px;margin:15px 0;box-shadow:0 5px 20px #0001}.panel.on{display:block}.panel input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:11px}.hero{background:linear-gradient(120deg,#090909,#302612);color:#fff;padding:30px;border-radius:25px}.hero strong{color:#d6b343}.cats{display:flex;gap:8px;overflow:auto;margin:20px 0}.cats button{border:0;background:white;padding:12px;border-radius:12px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:18px;overflow:hidden}.photo{aspect-ratio:1;padding:10px}.photo img{width:100%;height:100%;object-fit:contain}.info{padding:13px}.price{color:#b98a2e;font-size:18px;font-weight:900}.cart{background:#fff;margin-top:22px;padding:20px;border-radius:20px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}.msg{font-weight:bold;margin-top:10px}@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><div class="top"><div class="logo">JULKO STORE</div><input id="q" class="search" placeholder="Rechercher un produit ou une marque"><button class="b" onclick="show('login')">Connexion</button><button class="b gold" onclick="show('register')">Créer un compte</button><button class="b" onclick="goCart()">Panier <span id="count">0</span></button></div></header><main class="wrap"><div class="authbar"><span id="sessionText">Non connecté</span><button id="logout" class="b" style="display:none" onclick="logoutUser()">Déconnexion</button></div><section id="register" class="panel"><h2>Créer mon compte client</h2><input id="rName" placeholder="Nom complet"><input id="rPhone" placeholder="Numéro de téléphone" inputmode="tel"><input id="rPass" type="password" placeholder="Mot de passe, 12 caractères minimum"><button class="b gold" onclick="registerUser()">Créer mon compte</button><div id="rMsg" class="msg"></div></section><section id="login" class="panel"><h2>Se connecter</h2><input id="lPhone" placeholder="Numéro de téléphone" inputmode="tel"><input id="lPass" type="password" placeholder="Mot de passe"><button class="b gold" onclick="loginUser()">Connexion</button><div id="lMsg" class="msg"></div></section><section class="hero"><strong>GRAND-BASSAM</strong><h1>De vrais modèles, de vraies marques</h1><p>Paiement Wave à la livraison. Tarif communiqué par le service client.</p></section><div id="cats" class="cats"></div><h2>Nos produits</h2><section id="products" class="grid"></section><section id="cart" class="cart"><h2>Mon panier</h2><div id="items"></div><div class="row"><b>Total</b><b id="total" class="price">0 FCFA</b></div><button class="b gold" style="width:100%;margin-top:12px" onclick="order()">Commander</button><div id="orderMsg" class="msg"></div></section></main><script>const ps=[{b:'Samsung',n:'Galaxy A07 4/64 Go',c:'Téléphones',p:89000,img:'https://th.bing.com/th?id=OPEC.h%2fuiKaBLUEZnTQ474C474&o=5&pid=21.1&w=474&h=474'},{b:'Oraimo',n:'Air12 Pro',c:'Audio',p:7110,img:'https://th.bing.com/th?id=OPEC.yoeOwqQWo81X5A474C474&o=5&pid=21.1&w=304&h=304'},{b:'Oraimo',n:'SpaceBuds Lite OTW-324',c:'Audio',p:10500,img:'https://th.bing.com/th?id=OPEC.NpjLuWEaPsmCiw474C474&o=5&pid=21.1&w=408&h=408'},{b:'Oraimo',n:'Watch 6 Lite',c:'Montres',p:11400,img:'https://th.bing.com/th?id=OPEC.6FC1Y2s9UlR9hw474C474&o=5&pid=21.1&w=376&h=376'},{b:'Oraimo',n:'Space-Box OBS-382',c:'Audio',p:12000,img:'https://th.bing.com/th?id=OPEC.%2fQIiubmiCxN7aA474C474&o=5&pid=21.1&w=474&h=474'},{b:'Oraimo',n:'Chargeur USB Type-C 10W',c:'Accessoires',p:5000,img:'https://th.bing.com/th?id=OPEC.iIG08wOfto0hZw474C474&o=5&pid=21.1&w=489&h=489'}].map((x,i)=>({...x,id:i}));let cart=[],cat='Tous';const money=n=>n.toLocaleString('fr-FR')+' FCFA';function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.getElementById(id).scrollIntoView({behavior:'smooth'})}function renderCats(){cats.innerHTML=['Tous',...new Set(ps.map(x=>x.c))].map(x=>`<button onclick="cat='${x}';render()">${x}</button>`).join('')}function render(){const s=q.value.toLowerCase();products.innerHTML=ps.filter(x=>(cat==='Tous'||x.c===cat)&&(x.b+' '+x.n).toLowerCase().includes(s)).map(x=>`<article class="card"><div class="photo"><img src="${x.img}" alt="${x.b} ${x.n}"></div><div class="info"><small>${x.b}</small><h3>${x.n}</h3><div class="price">${money(x.p)}</div><button class="b" onclick="add(${x.id})">Ajouter</button></div></article>`).join('')}function add(id){const z=cart.find(x=>x.id===id);z?z.qty++:cart.push({id,qty:1});draw()}function draw(){count.textContent=cart.reduce((s,x)=>s+x.qty,0);items.innerHTML=cart.length?cart.map(x=>`<div class="row"><span>${ps[x.id].n} × ${x.qty}</span><b>${money(ps[x.id].p*x.qty)}</b></div>`).join(''):'Panier vide';total.textContent=money(cart.reduce((s,x)=>s+ps[x.id].p*x.qty,0))}function goCart(){document.getElementById('cart').scrollIntoView({behavior:'smooth'})}async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return {ok:r.ok,data:await r.json().catch(()=>({error:'Erreur serveur'}))}}async function registerUser(){const z=await api('/api/auth/register',{name:rName.value,phone:rPhone.value,password:rPass.value});rMsg.textContent=z.ok?'Compte créé. Tu peux maintenant te connecter.':z.data.error||'Inscription impossible'}async function loginUser(){const z=await api('/api/auth/login',{phone:lPhone.value,password:lPass.value});if(z.ok){localStorage.setItem('julko_token',z.data.token);localStorage.setItem('julko_user',JSON.stringify(z.data.user));updateSession();lMsg.textContent='Connexion réussie.'}else lMsg.textContent=z.data.error||'Connexion impossible'}function updateSession(){const u=JSON.parse(localStorage.getItem('julko_user')||'null');sessionText.textContent=u?'Connecté : '+u.name:'Non connecté';logout.style.display=u?'inline-block':'none'}function logoutUser(){localStorage.removeItem('julko_token');localStorage.removeItem('julko_user');updateSession()}function order(){if(!localStorage.getItem('julko_token')){orderMsg.textContent='Connecte-toi ou crée un compte avant de commander.';show('login');return}orderMsg.textContent=cart.length?'Commande prête. Le service client confirmera la livraison et le paiement Wave.':'Ajoute un produit.'}q.addEventListener('input',render);renderCats();render();draw();updateSession();</script></body></html>
