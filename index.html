<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JULKO STORE</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f4ef;color:#111}header{background:#090909;color:#fff;padding:18px;position:sticky;top:0}nav{max-width:1100px;margin:auto;display:flex;gap:15px;align-items:center}.logo{font-weight:900;font-size:24px;color:#d4af37}.search{flex:1;padding:12px;border-radius:12px;border:0}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:linear-gradient(120deg,#080808,#2b2412);color:#fff;border-radius:25px;padding:38px}.hero b,.price{color:#b98a2e}.cats{display:flex;gap:8px;overflow:auto;margin:22px 0}.cats button,.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.cats button{background:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border-radius:18px;padding:14px;box-shadow:0 4px 18px #0000000b}.pic{height:145px;display:flex;align-items:center;justify-content:center;font-size:64px;background:#fafafa;border-radius:14px}.btn{width:100%;background:#111;color:white}.cart{margin-top:25px;background:white;padding:20px;border-radius:20px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.wave{background:#1dc9e8;color:#002a30}.contact{background:#b98a2e;color:#fff}.note{font-size:13px;color:#666}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.logo{font-size:18px}.hero{padding:24px}}@media(max-width:420px){nav{flex-wrap:wrap}.search{order:3;flex-basis:100%}}</style></head><body><header><nav><div class="logo">JULKO STORE</div><input id="q" class="search" placeholder="Rechercher un produit"><button class="btn" onclick="showCart()">Panier <span id="n">0</span></button></nav></header><main class="wrap"><section class="hero"><b>GRAND-BASSAM</b><h1>Mode, technologie & accessoires</h1><p>Commande simple. Livraison partout en Côte d’Ivoire. Le tarif de livraison est confirmé par le service client.</p></section><div id="cats" class="cats"></div><h2>Nos produits</h2><section id="products" class="grid"></section><section id="cart" class="cart"><h2>Mon panier</h2><div id="items"></div><div class="row"><b>Total produits</b><b id="total" class="price">0 FCFA</b></div><p class="note">Frais de livraison : contactez le service client pour connaître le tarif.</p><button class="btn wave" onclick="order()">Commander • Wave à la livraison</button><button class="btn contact" style="margin-top:8px" onclick="contact()">Contacter JULKO STORE</button><p id="msg" aria-live="polite"></p></section></main><script>const ps=[['Poedagar','Montre business 680','Montres & Bijoux',3155,'⌚'],['Oraimo','SpaceBuds Air+','Audio',9790,'🎧'],['Oraimo','Power Bank 10 000 mAh','Téléphone',12000,'🔋'],['Oraimo','Watch 6R','Connectés',13200,'⌚'],['Oraimo','Space-Box OBS-382','Audio',12000,'🔊'],['Samsung','Galaxy A07','Téléphones',75200,'📱'],['HP','250R G10 Core i3','Ordinateurs',376000,'💻'],['Generic','Coque téléphone','Téléphone',5000,'📱'],['Generic','Verre trempé','Téléphone',2000,'🛡️'],['Generic','Chargeur rapide','Téléphone',5000,'⚡'],['Generic','Support téléphone','Téléphone',4000,'📲'],['Generic','Câble USB-C','Téléphone',2500,'🔌'],['Smart Tag','Localisateur Bluetooth','Connectés',2700,'📍'],['Julko Selection','Sac bandoulière','Accessoires',8500,'👜'],['Julko Selection','Réveil numérique','Accessoires',7000,'⏰'],['Julko Selection','Bande LED','Accessoires',6500,'💡']].map((x,i)=>({id:i,b:x[0],n:x[1],c:x[2],p:x[3],i:x[4]}));let cat='Tous',cart=[];const f=n=>n.toLocaleString('fr-FR')+' FCFA';function renderCats(){const cs=['Tous',...new Set(ps.map(x=>x.c))];cats.innerHTML=cs.map(x=>`<button onclick="setCat('${x}')">${x}</button>`).join('')}function setCat(x){cat=x;render()}function render(){let s=q.value.toLowerCase();let l=ps.filter(x=>(cat==='Tous'||x.c===cat)&&(x.b+' '+x.n).toLowerCase().includes(s)).sort((a,b)=>a.p-b.p);products.innerHTML=l.map(x=>`<article class="card"><div class="pic">${x.i}</div><small>${x.b}</small><h3>${x.n}</h3><b class="price">${f(x.p)}</b><button class="btn" onclick="add(${x.id})">Ajouter au panier</button></article>`).join('')}function add(id){let z=cart.find(x=>x.id===id);z?z.qty++:cart.push({id,qty:1});drawCart()}function drawCart(){n.textContent=cart.reduce((s,x)=>s+x.qty,0);items.innerHTML=cart.length?cart.map(x=>{let p=ps[x.id];return `<div class="row"><span>${p.b} ${p.n} × ${x.qty}</span><span>${f(p.p*x.qty)}</span></div>`}).join(''):'Panier vide';total.textContent=f(cart.reduce((s,x)=>s+ps[x.id].p*x.qty,0))}function showCart(){document.querySelector('#cart').scrollIntoView({behavior:'smooth'})}function order(){msg.textContent=cart.length?'Commande préparée. Le service client confirmera la livraison. Paiement Wave à la livraison.':'Ajoutez d’abord un produit.'}function contact(){location.href='https://wa.me/2250757290996'}q.addEventListener('input',render);renderCats();render();drawCart();</script></body></html>
